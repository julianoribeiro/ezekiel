[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ezekiel"
version = "0.1.0"
description = "Otimização de Processos Interdependentes com Agentes Autônomos"
requires-python = ">=3.11"
dependencies = [
    # OCEL + Process Mining
    "pm4py>=2.7.0",

    # Simulação
    "simpy>=4.1.1",

    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Dados
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",

    # Config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

[project.scripts]
ezekiel = "ezekiel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["ezekiel"]

[tool.ruff]
line-length = 100
target-version = "py311"
